spring:
  application:
    name: faircart-backend
  profiles:
    active: dev
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your-real-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:hfps pupq daab phmm}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: 8080
  servlet:
    context-path: /

faircart:
  api:
    base-path: /api/v1
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-for-production-use}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.faircart: DEBUG
    org.springframework.security: INFO
