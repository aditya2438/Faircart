<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication & Security — Faircart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="selection:bg-indigo-500 selection:text-white flex flex-col min-h-screen">

    <!-- Magnetic Custom Mouse Cursor -->
    <div class="custom-cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Top Navigation -->
    <header class="fixed top-4 left-4 right-4 max-w-7xl mx-auto z-50">
        <nav class="glass-panel px-6 py-3.5 flex justify-between items-center">
            <a href="../index.html" class="flex items-center gap-2.5 text-xl font-extrabold tracking-tight">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-['Outfit'] font-bold bg-gradient-to-r from-indigo-400 via-cyan-300 to-white bg-clip-text text-transparent">Faircart</span>
            </a>
            
            <div class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="../index.html" class="text-slate-300 hover:text-white transition-colors flex items-center gap-1.5"><i data-lucide="home" class="w-4 h-4"></i> Home</a>
                <a href="products.html" class="text-slate-300 hover:text-white transition-colors flex items-center gap-1.5"><i data-lucide="grid" class="w-4 h-4"></i> Catalog</a>
                <a href="results.html" class="text-slate-300 hover:text-white transition-colors flex items-center gap-1.5"><i data-lucide="compass" class="w-4 h-4"></i> Compare Arena</a>
                <a href="wishlist.html" class="text-slate-300 hover:text-white transition-colors flex items-center gap-1.5"><i data-lucide="bell" class="w-4 h-4"></i> Price Alerts</a>
                <a href="cart.html" class="text-slate-300 hover:text-white transition-colors flex items-center gap-1.5"><i data-lucide="shopping-bag" class="w-4 h-4"></i> Smart Basket</a>
            </div>

            <div class="flex items-center gap-4">
                <div class="theme-switch theme-switch-btn" title="Toggle Light/Dark Mode">
                    <div class="theme-switch-thumb shadow-md">
                        <i data-lucide="moon" class="w-3.5 h-3.5"></i>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 pt-28 pb-16">
        <div class="glass-panel w-full max-w-md p-8 relative overflow-hidden shadow-2xl">
            <!-- Modal Header -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto mb-3 border border-indigo-500/30">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold font-['Outfit'] text-white">Faircart Security Hub</h1>
                <p class="text-xs text-slate-400 mt-1">Stateless JWT + Dual-Channel Redis MFA OTP</p>
            </div>

            <!-- Auth Mode Switcher Tabs -->
            <div class="grid grid-cols-2 p-1 rounded-xl bg-white/5 border border-white/10 mb-6 text-xs font-semibold">
                <button id="tabPasswordBtn" onclick="switchAuthTab('password')" class="py-2 rounded-lg bg-indigo-600 text-white transition-all">Password Sign-In</button>
                <button id="tabOtpBtn" onclick="switchAuthTab('otp')" class="py-2 rounded-lg text-slate-400 hover:text-white transition-all">Phone / Email OTP</button>
            </div>

            <!-- Tab 1: Password Form -->
            <form id="passwordForm" class="space-y-4" onsubmit="handlePasswordLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                    <input type="email" required id="loginEmail" placeholder="you@faircart.com" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                    <input type="password" required id="loginPassword" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition-all">
                    Sign In with Password
                </button>
            </form>

            <!-- Tab 2: OTP Form -->
            <div id="otpForm" class="space-y-4 hidden">
                <div id="otpStep1">
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Phone (+91) or Email Address</label>
                    <input type="text" id="otpDestination" placeholder="+919876543210 or user@example.com" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-indigo-500 mb-3">
                    <button onclick="requestOtpCode()" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 text-white font-bold text-xs shadow-lg transition-all">
                        Send 6-Digit Verification Code
                    </button>
                </div>

                <div id="otpStep2" class="space-y-4 hidden">
                    <div class="text-center">
                        <p class="text-xs text-slate-300">Enter the 6-digit code sent to <strong id="sentTargetDisplay" class="text-indigo-400"></strong></p>
                        <p class="text-[10px] text-amber-400 mt-1">Expires in 5:00 minutes (Redis TTL)</p>
                    </div>

                    <!-- 6-Pin Boxes -->
                    <div class="flex justify-between gap-2 my-4">
                        <input type="text" maxlength="1" class="otp-digit w-10 h-12 text-center text-lg font-bold bg-white/10 border border-white/20 rounded-xl text-white outline-none focus:border-indigo-500" />
                        <input type="text" maxlength="1" class="otp-digit w-10 h-12 text-center text-lg font-bold bg-white/10 border border-white/20 rounded-xl text-white outline-none focus:border-indigo-500" />
                        <input type="text" maxlength="1" class="otp-digit w-10 h-12 text-center text-lg font-bold bg-white/10 border border-white/20 rounded-xl text-white outline-none focus:border-indigo-500" />
                        <input type="text" maxlength="1" class="otp-digit w-10 h-12 text-center text-lg font-bold bg-white/10 border border-white/20 rounded-xl text-white outline-none focus:border-indigo-500" />
                        <input type="text" maxlength="1" class="otp-digit w-10 h-12 text-center text-lg font-bold bg-white/10 border border-white/20 rounded-xl text-white outline-none focus:border-indigo-500" />
                        <input type="text" maxlength="1" class="otp-digit w-10 h-12 text-center text-lg font-bold bg-white/10 border border-white/20 rounded-xl text-white outline-none focus:border-indigo-500" />
                    </div>

                    <button onclick="verifyOtpCode()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-lg transition-all">
                        Verify Code & Sign In
                    </button>
                </div>
            </div>

            <!-- Privacy & Data Protection -->
            <div class="mt-8 pt-6 border-t border-white/10 text-center space-y-3">
                <p class="text-[11px] text-slate-500">DPDP Act (India) & GDPR Privacy Compliant</p>
                <button onclick="deleteAccountPrompt()" class="text-[11px] text-rose-400 hover:underline">
                    Request Complete Account & Data Erasure
                </button>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        lucide.createIcons();

        function switchAuthTab(tab) {
            const tabPass = document.getElementById('tabPasswordBtn');
            const tabOtp = document.getElementById('tabOtpBtn');
            const passForm = document.getElementById('passwordForm');
            const otpForm = document.getElementById('otpForm');

            if (tab === 'password') {
                tabPass.className = 'py-2 rounded-lg bg-indigo-600 text-white transition-all';
                tabOtp.className = 'py-2 rounded-lg text-slate-400 hover:text-white transition-all';
                passForm.classList.remove('hidden');
                otpForm.classList.add('hidden');
            } else {
                tabOtp.className = 'py-2 rounded-lg bg-indigo-600 text-white transition-all';
                tabPass.className = 'py-2 rounded-lg text-slate-400 hover:text-white transition-all';
                otpForm.classList.remove('hidden');
                passForm.classList.add('hidden');
            }
        }

        function requestOtpCode() {
            const dest = document.getElementById('otpDestination').value.trim();
            if (!dest) {
                alert('Please enter an email or phone number');
                return;
            }
            document.getElementById('sentTargetDisplay').textContent = dest;
            document.getElementById('otpStep1').classList.add('hidden');
            document.getElementById('otpStep2').classList.remove('hidden');
            setupPinInputs();
        }

        function setupPinInputs() {
            const inputs = document.querySelectorAll('.otp-digit');
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            inputs[0].focus();
        }

        function verifyOtpCode() {
            let code = '';
            document.querySelectorAll('.otp-digit').forEach(i => code += i.value);
            if (code.length < 6) {
                alert('Please enter the full 6-digit code');
                return;
            }
            alert('Verified successfully! Redirecting to Faircart Dashboard...');
            window.location.href = '../index.html';
        }

        function handlePasswordLogin(e) {
            e.preventDefault();
            alert('Authentication successful! Welcome to Faircart.');
            window.location.href = '../index.html';
        }

        function deleteAccountPrompt() {
            if (confirm('Are you sure you want to permanently erase your account, tracked price alerts, and recommendation logs under DPDP compliance?')) {
                alert('Account and telemetry data marked for cryptographic erasure.');
            }
        }
    </script>
</body>
</html>
